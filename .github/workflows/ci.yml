name: CI Native Secure Universal

on:
  push:
    branches: [ "main", "master", "0812" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master", "0812" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-check:
    name: Run Multi-Language Checks
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Safely
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Setup Tools and Run Analysis
        run: |
          echo "=== 1. Verificando e Instalando Dependências ==="
          if ! command -v gcovr &> /dev/null || (! command -v qmake &> /dev/null && ! command -v qmake6 &> /dev/null); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              python3-pip \
              python3-venv \
              cppcheck \
              qtquickcontrols2-5-dev \
              libqt5quickcontrols2-5 \
              qtbase5-dev \
              qtdeclarative5-dev \
              libqt5websockets5-dev \
              libqt5serialport5-dev \
              qt6-base-dev \
              qt6-declarative-dev \
              qt6-websockets-dev \
              libgl1-mesa-dev \
              gcovr
          else
            echo "Ferramentas principais já detectadas no runner."
          fi
            
          pip3 install --upgrade pip ruff coverage cpplint --break-system-packages
          
          echo "=== 2. Executando Ruff (Python) ==="
          if find . -maxdepth 3 -name "*.py" | grep -q .; then
            ruff check . || true
          fi

          echo "=== 3. Executando Cpplint (C/C++ - Estilo) ==="
          if find . -maxdepth 3 \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) | grep -q .; then
            find . -maxdepth 3 \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -exec cpplint --filter=-legal/copyright {} + || true
          fi

          echo "=== 4. Executando Cppcheck (C/C++) ==="
          if find . -maxdepth 3 \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) | grep -q .; then
            cppcheck --enable=warning,style . || true
          fi

          echo "=== 5. Executando Coverage (Testes Python) ==="
          if [ -d "tests" ] || [ -d "test" ] || find . -maxdepth 2 -name "test_*.py" | grep -q .; then
            coverage run -m pytest || true
          else
            PY_FILE=$(find . -maxdepth 2 -name "*.py" ! -name "test_*.py" | head -n 1)
            if [ -n "$PY_FILE" ]; then
              coverage run "$PY_FILE" || true
            fi
          fi
          coverage report -m || true
          coverage html || true

          echo "=== 6. Cobertura C/C++ Nativa (Qt5 / Qt6 Universal) ==="

          # --- 1. LIMPEZA DE CACHES ANTERIORES (Protegida) ---
          echo "Limpando caches e arquivos residuais..."
          for mf in $(find . -name "Makefile" -o -name "makefile"); do
            if grep -q "CMAKE_COMMAND" "$mf" 2>/dev/null || grep -q "cmake_check_build_system" "$mf" 2>/dev/null; then
              echo "-> Removendo Makefile obsoleto do CMake encontrado em: $mf"
              rm -f "$mf"
            fi
          done
          rm -rf .qmake.stash *.o *.obj *.gcda *.gcno moc_* ui_* qrc_* build- *arm64-v8a x86_64 build *release* *debug* || true
          git checkout Makefile 2>/dev/null || true

          # Localiza o diretório do projeto
          BUILD_TYPE=""
          PROJ_DIR="."

          if [ -f "CMakeLists.txt" ]; then
            BUILD_TYPE="cmake"
            echo "-> Projeto CMake detectado!"
            sed -i '/QuickControls2/d' CMakeLists.txt || true
          elif find . -maxdepth 3 -name "*.pro" | grep -q .; then
            BUILD_TYPE="qmake"
            echo "-> Projeto Qt (.pro) detectado!"
          elif [ -f "Makefile" ] || [ -f "makefile" ]; then
            BUILD_TYPE="make"
            echo "-> Makefile puro detectado!"
          else
            # Procura em subpastas caso esteja isolado
            SUB_PRO=$(find . -path "./.git" -prune -o -name "*.pro" -print -o -name "CMakeLists.txt" -print -o -name "Makefile" -print | head -n 1)
            if [ -n "$SUB_PRO" ]; then
              PROJ_DIR=$(dirname "$SUB_PRO")
              cd "$PROJ_DIR"
              if [ -f "CMakeLists.txt" ]; then
                BUILD_TYPE="cmake"
              elif ls *.pro 1> /dev/null 2>&1; then
                BUILD_TYPE="qmake"
              elif [ -f "Makefile" ] || [ -f "makefile" ]; then
                BUILD_TYPE="make"
              fi
            fi
          fi

          # 1. Se for CMake
          if [ "$BUILD_TYPE" = "cmake" ]; then
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_FLAGS="-fprofile-arcs -ftest-coverage -O0 -g" \
                  -DCMAKE_C_FLAGS="-fprofile-arcs -ftest-coverage -O0 -g" \
                  -DCMAKE_EXE_LINKER_FLAGS="-fprofile-arcs -ftest-coverage" \
                  ..
            make -j$(nproc)
            cd ..
            
          # 2. Se for um projeto Qt (.pro)
          elif find . -maxdepth 3 -name "*.pro" | grep -q .; then
            PRO_FILE=$(find . -maxdepth 2 -name "*.pro" | head -n 1)
            PRO_DIR=$(dirname "$PRO_FILE")
            cd "$PRO_DIR"
            
            echo "-> Projeto Qt (.pro) detectado em: $PRO_DIR"
            
            # Seleção inteligente entre Qt5 e Qt6
            QMAKE_CMD=""
            
            # Verifica se o projeto exige explicitamente Qt6 no .pro
            if grep -E -q "qtHaveModule\(.*6\)|QT.*=.*qt6|greaterThan\(QT_VERSION,\s*5\." "$(basename "$PRO_FILE")"; then
              echo "-> Projeto identificado explicitamente como Qt6."
              QMAKE_CMD="qmake6"
            else
              # Se for Qt5, busca o qmake5 específico ou o qmake padrão do sistema
              if command -v qmake5 &> /dev/null; then
                QMAKE_CMD="qmake5"
                echo "-> Utilizando qmake5 detectado no sistema."
              else
                QMAKE_CMD="qmake"
                echo "-> Utilizando qmake padrão."
              fi
            fi
            
            echo "Configurando via $QMAKE_CMD..."
            
            # Tenta compilar com a escolha inicial; se falhar, tenta o fallback automático
            $QMAKE_CMD "QMAKE_CXXFLAGS+=-fprofile-arcs -ftest-coverage -O0 -g" "QMAKE_LFLAGS+=-fprofile-arcs -ftest-coverage" || {
              if [ "$QMAKE_CMD" = "qmake6" ]; then
                qmake "QMAKE_CXXFLAGS+=-fprofile-arcs -ftest-coverage -O0 -g" "QMAKE_LFLAGS+=-fprofile-arcs -ftest-coverage"
              else
                qmake6 "QMAKE_CXXFLAGS+=-fprofile-arcs -ftest-coverage -O0 -g" "QMAKE_LFLAGS+=-fprofile-arcs -ftest-coverage"
              fi
            }
            make -j$(nproc)

          # 3. Se for Makefile puro
          elif [ -f "Makefile" ] || [ -f "makefile" ]; then
            echo "-> Makefile puro detectado e pronto para compilação!"
            if grep -q "CFLAGS" Makefile 2>/dev/null || grep -q "CFLAGS" makefile 2>/dev/null; then
              make CFLAGS="-fprofile-arcs -ftest-coverage -O0 -g" CXXFLAGS="-fprofile-arcs -ftest-coverage -O0 -g" LDFLAGS="-fprofile-arcs -ftest-coverage" -j$(nproc)
            else
              make CC="gcc -fprofile-arcs -ftest-coverage -O0 -g" CXX="g++ -fprofile-arcs -ftest-coverage -O0 -g" -j$(nproc)
            fi
          else
            echo "⚠️ Nenhum sistema de build reconhecido."
          fi

          # --- EXECUÇÃO ESPECÍFICA DA SUÍTE QTEST ---
          echo "Procurando e executando binários de teste QTest..."
          TEST_EXECUTED=false
          
          for bin in $(find . -path "./.git" -prune -o -type f -executable ! -name "*.sh" ! -name "*.pro" ! -name "Makefile" ! -name "CMakeLists.txt" ! -name "*.sample" -print); do
            if file "$bin" | grep -q "ELF"; then
              # Filtra para rodar preferencialmente binários que contenham 'test' ou 'tst' no nome, ou roda todos se não houver filtro estrito
              if [[ "$bin" == *test* ]] || [[ "$bin" == *tst* ]]; then
                echo "Executando QTest: $bin"
                QT_QPA_PLATFORM=offscreen "$bin" -v2 || true
                TEST_EXECUTED=true
              fi
            fi
          done

          if [ "$TEST_EXECUTED" = false ]; then
            echo "Nenhum binário de teste explícito encontrado. Executando binários disponíveis..."
            for bin in $(find . -path "./.git" -prune -o -type f -executable ! -name "*.sh" ! -name "*.pro" ! -name "Makefile" ! -name "makefile" ! -name "CMakeLists.txt" ! -name "*.sample" -print); do
              if file "$bin" | grep -q "ELF"; then
                echo "Executando binário ELF: $bin"
                QT_QPA_PLATFORM=offscreen timeout 5s "$bin" || true
              fi
            done
          fi  
          cd - > /dev/null 2>&1 || true
          
          WORKSPACE_ROOT="$PWD"
          mkdir -p "$WORKSPACE_ROOT/htmlcov_cpp"
          
          gcovr --root . \
                --html-details "$WORKSPACE_ROOT/htmlcov_cpp/index.html" \
                --exclude-unreachable-branches \
                --print-summary \
                --gcov-ignore-parse-errors \
                || true

          # Verifica se os arquivos HTML foram realmente criados
          if [ -f "htmlcov_cpp/index.html" ]; then
            echo "Sucesso: Relatório index.html gerado com sucesso!"
          else
            echo "Aviso: Nenhum arquivo index.html foi encontrado. Verifique se os binários geraram contadores de cobertura."
          fi
          
          echo "=== 7. Verificação concluída com sucesso ==="
          
      - name: Publicar Relatório de Cobertura na Branch Coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          # 1. Procura automaticamente pelo index.html em qualquer subpasta do repositório
          HTML_FILE=$(find . -name "index.html" -path "*/htmlcov_cpp/*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "⚠️ Aviso: O arquivo 'index.html' não foi encontrado em nenhuma subpasta."
            exit 0
          fi

          # 2. Descobre qual é a pasta exata onde o relatório está guardado
          REPORT_DIR=$(dirname "$HTML_FILE")
          echo "Relatório localizado com sucesso em: $REPORT_DIR"
          
          git config --global user.name "Ottertechs CI Bot"
          git config --global user.email "ci@ottertechs.local"
          
          # Cria uma branch isolada para os relatórios se não existir
          git checkout --orphan coverage-history || git checkout coverage-history
          
          # Remove arquivos antigos e copia o novo relatório
          git rm -rf . || true
          mkdir -p coverage
          cp -r "$REPORT_DIR"/* coverage/
          
          # Adiciona, commita e envia de volta
          git add coverage/
          git commit -m "CI: Atualiza relatório de cobertura gcovr em $(date -u)" || echo "Sem alterações para commitar"
          git push origin coverage-history --force || true
          
          echo "Relatório publicado na branch 'coverage-history' com sucesso!"
